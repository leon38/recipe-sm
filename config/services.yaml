# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    ANTHROPIC_API_KEY: '%env(ANTHROPIC_API_KEY)%'
    GEMINI_API_KEY: '%env(GEMINI_API_KEY)%'
    recipe_upload_directory: '%kernel.project_dir%/public/uploads/recipes'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Domain/**/Entity/'
            - '../src/Domain/**/ValueObject/'
            - '../src/Kernel.php'

    App\UI\Http\Controller\:
        resource: '../src/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    _instanceof:
        # services whose classes are instances of CustomInterface will be tagged automatically
        App\Application\Recipe\Service\RecipeImporterInterface:
            tags: ['app.recipe_importer']   

    App\Application\Recipe\Service\RecipeImporterRegistry:
        arguments:
            - !tagged_iterator 'app.recipe_importer'

    App\Infrastructure\Import\Parser\RecipeParserInterface:
        alias: App\Infrastructure\Import\Parser\RegexRecipeParser    

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Domain\Recipe\Repository\RecipeRepositoryInterface:
        alias: App\Infrastructure\Doctrine\Recipe\DoctrineRecipeRepository 

    App\Domain\Recipe\Repository\CategoryRepositoryInterface:
        alias: App\Infrastructure\Doctrine\Recipe\DoctrineCategoryRepository      


    #################################################################
    # CQRS
    #################################################################

    App\Infrastructure\CommandBus\CommandBusInterface:
        alias: App\Infrastructure\CommandBus\CommandBus

    App\Infrastructure\QueryBus\QueryBusInterface:
        alias: App\Infrastructure\QueryBus\QueryBus     

    OpenAI\Client:
        factory:
            - OpenAI
            - client
        arguments:
            - '%env(OPENAI_API_KEY)%'    
    
    App\Application\Image\ImageStorageInterface:
        alias: App\Infrastructure\Image\FilesystemImageStorage