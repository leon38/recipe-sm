security:
    password_hashers:
        App\Domain\User\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Domain\User\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }

        # Lecture publique
        - { path: ^/api/recipe$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/recipe/, methods: [GET], roles: PUBLIC_ACCESS }

        # Écriture protégée
        - { path: ^/api/recipe$, methods: [POST], roles: ROLE_USER }
        - { path: ^/api/recipe/, methods: [PUT, DELETE], roles: ROLE_USER }