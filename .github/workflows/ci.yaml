name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

        with:
          php-version: ${{ env.PHP_VERSION }}

          extensions: >
            mbstring,
            intl,
            xml,
            ctype,
            iconv,
            dom

          coverage: none

          tools: composer

      - name: Create .env for CI
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=ci-secret
          DATABASE_URL=mysql://recipe:recipe@127.0.0.1:3306/recipe_test?serverVersion=8.4
          DEFAULT_URI=http://localhost
          CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
          EOF
      
      - name: Install dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: PHPStan
        run: |
          vendor/bin/phpstan analyse \
            --no-progress

      - name: PHP-CS-Fixer
        run: |
          vendor/bin/php-cs-fixer fix \
            --dry-run \
            --diff

      - name: Deptrac
        run: |
          vendor/bin/deptrac analyse
  tests:
    name: PHPUnit & Behat
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: recipe_test
          MYSQL_USER: recipe
          MYSQL_PASSWORD: recipe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: mysql://recipe:recipe@127.0.0.1:3306/recipe_test?serverVersion=8.4
      PHP_VERSION: 8.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: >
            mbstring,
            intl,
            pdo_mysql,
            xml,
            ctype,
            iconv,
            json,
            tokenizer,
            dom
          coverage: none
          tools: composer



      - name: Check PHP version
        run: php -v

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Create .env for CI
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=ci-secret
          DATABASE_URL=mysql://recipe:recipe@127.0.0.1:3306/recipe_test?serverVersion=8.4
          EOF

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader


      - name: Prepare database
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction


      - name: Load fixtures
        run: |
          php bin/console doctrine:fixtures:load \
            --no-interaction

      - name: Prepare database
        run: |

          php bin/console doctrine:database:create \
            --if-not-exists

          php bin/console doctrine:migrations:migrate \
            --no-interaction


      - name: Load fixtures
        run: |
          php bin/console doctrine:fixtures:load \
            --no-interaction

      - name: PHPUnit
        run: |
          vendor/bin/phpunit

      - name: Behat
        run: |
          vendor/bin/behat