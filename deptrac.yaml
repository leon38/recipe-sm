deptrac:
    paths:
        - ./src

    exclude_files:
        - '#.*test.*#'

    layers:
        -
            name: Domain
            collectors:
                -
                    type: classLike
                    value: '^App\\Domain\\.*'

        -
            name: Application
            collectors:
                -
                    type: classLike
                    value: '^App\\Application\\.*'

        -
            name: Infrastructure
            collectors:
                -
                    type: classLike
                    value: '^App\\Infrastructure\\.*'

        -
            name: UI
            collectors:
                -
                    type: classLike
                    value: '^App\\UI\\.*'

        -
            name: Doctrine
            collectors:
                -
                    type: classLike
                    value: '^Doctrine\\.*'

        -
            name: Symfony
            collectors:
                -
                    type: classLike
                    value: '^Symfony\\.*'

    ruleset:
        Domain:
            - Doctrine
            - Symfony

        Application:
            - Domain
            - Symfony

        Infrastructure:
            - Domain
            - Application
            - Doctrine
            - Symfony

        UI:
            - Application
            - Domain
            - Symfony